name: AI PR Review

# Combined merge-gate caller (review job + eval job). Design: ADR-0005.
# No paths: filter by design — see the ADR before adding one.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# id-token: write — analytics event (MAN-1602); job-level permissions replace workflow-level, so both blocks list it.
permissions:
  contents: read
  models: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Draft is the only caller-level skip: a draft cannot merge, and
    # ready_for_review fires a fresh run that reports the real context.
    # Dependabot/fork skips live INSIDE the reusable (skip_dependabot /
    # skip_forks below) so the check context is still reported as success —
    # a caller-level `if:` skip reports a different, shorter context and a
    # required check then hangs forever. Rationale: ADR-0005.
    if: ${{ github.event.pull_request.draft == false }}
    permissions:
      contents: read
      models: read
      pull-requests: write
      issues: write
      id-token: write
    uses: everstake/infra-ai-platform/.github/workflows/ai-pr-review.yml@858c00dab29d0192a45b3ed6260b7a0fb0ef85e0 # v2.14.1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      variant: universal
      model: claude-sonnet-5-5
      # Generated lockfiles carry no review value and inflate the diff.
      diff_exclude_extra: '^diff --git .*(yarn\.lock|package-lock\.json|pnpm-lock\.yaml|go\.sum)'
      gate_on_recommendation: true
      require_codebase: false
      # Label bypass disabled under a merge gate — the only sanctioned
      # bypass is the org ruleset's bypass list. Empty matches no label.
      skip_label: ""
      skip_dependabot: true
      skip_forks: true
      client_id: ${{ vars.AI_REVIEW_APP_CLIENT_ID }}
      infra_ai_ref: 858c00dab29d0192a45b3ed6260b7a0fb0ef85e0
      # events_*: optional analytics event (MAN-1602), set all three or none — values in the runbook.
      # events_workload_identity_provider: projects/<num>/locations/global/workloadIdentityPools/github-ci-pool/providers/github-oidc
      # events_service_account: <publisher-sa>@<project>.iam.gserviceaccount.com
      # events_topic: projects/<project>/topics/ai-review-events
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_FOR_IS }}

  eval:
    needs: review
    # A skipped review concludes SUCCESS (so its check context is reported);
    # the output is what tells us not to judge a review that never ran.
    if: ${{ needs.review.outputs.skipped != 'true' }}
    permissions:
      contents: read
      models: read
      pull-requests: write
      issues: write
      id-token: write
    uses: everstake/infra-ai-platform/.github/workflows/ai-pr-eval.yml@858c00dab29d0192a45b3ed6260b7a0fb0ef85e0 # v2.14.1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      variant: universal
      # Generated lockfiles carry no review value and inflate the diff.
      diff_exclude_extra: '^diff --git .*(yarn\.lock|package-lock\.json|pnpm-lock\.yaml|go\.sum)'
      model: claude-sonnet-5-5
      gate_min_score: 9
      require_codebase: false
      client_id: ${{ vars.AI_REVIEW_APP_CLIENT_ID }}
      infra_ai_ref: 858c00dab29d0192a45b3ed6260b7a0fb0ef85e0
      # events_*: optional analytics event (MAN-1602), set all three or none — values in the runbook.
      # events_workload_identity_provider: projects/<num>/locations/global/workloadIdentityPools/github-ci-pool/providers/github-oidc
      # events_service_account: <publisher-sa>@<project>.iam.gserviceaccount.com
      # events_topic: projects/<project>/topics/ai-review-events
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_FOR_IS }}
